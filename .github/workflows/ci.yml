name: CI Workflow

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
        description: "CDK stack environment suffix (dev or prod)"
      environment:
        required: true
        type: string
        description: "GitHub environment name (dev or prod)"
      run-deploy:
        required: false
        type: boolean
        default: true
        description: "Whether to run the deploy job"

permissions:
  id-token: write # for AWS OIDC (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - name: Check formatting
        run: make fmt-check
      - name: Run go vet
        run: make vet
      - name: Run tests
        run: make test
      - name: Build Lambda artifacts
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: ./dist/*.zip
          # Only the later jobs in this run read it.
          retention-days: 1

  cdk-checks:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ./dist
      - name: Run go vet (cdk)
        run: cd cdk && go vet .
      - name: Validate state machine JSON
        run: for f in cdk/statemachines/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Validate CDK app synthesizes
        run: cd cdk && npx cdk synth --all --quiet

  deploy:
    runs-on: ubuntu-latest
    needs: [build, cdk-checks]
    if: ${{ inputs.run-deploy }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.8
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: ./dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::120356305272:role/github-actions-deploy
          aws-region: us-west-2
      - name: Install CDK CLI
        run: cd cdk && npm ci
      - name: Refuse to deploy over a stack this app didn't create
        # Zappa named its CloudFormation stacks <project>-<stage>, and the first dev deploy
        # silently took over Zappa's lunch-buddies-dev stack (design doc §8). If the target
        # stack exists, it must carry this app's RecordsTable output.
        run: |
          STACK_NAME=lunch-buddies-${{ inputs.stack }}
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" > /dev/null 2>&1; then
            OURS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='OutputRecordsTable'].OutputValue" --output text)
            if [ -z "$OURS" ] || [ "$OURS" = "None" ]; then
              echo "::error::Stack $STACK_NAME exists but wasn't created by this app; refusing to deploy over it."
              exit 1
            fi
            echo "Stack $STACK_NAME exists and is ours ($OURS); updating."
          else
            echo "Stack $STACK_NAME doesn't exist yet; it will be created."
          fi
      - name: Deploy stack
        run: cd cdk && npx cdk deploy lunch-buddies-${{ inputs.stack }} --require-approval never
      - name: Verify deployed API (/v1/ping)
        run: |
          STACK_NAME=lunch-buddies-${{ inputs.stack }}
          BASE_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='OutputCustomDomainURL'].OutputValue" --output text)
          PING_URL="${BASE_URL}/v1/ping?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Calling $PING_URL"
          curl --fail --show-error --silent --retry 10 --retry-delay 6 --retry-all-errors "$PING_URL"
