name: Deploy

# Every push to master deploys the prod stack. A stack can also be deployed by hand from the
# Actions tab. Prod's API runs in forwarding mode until cutover (design doc §8), so deploying
# it doesn't change what serves Slack traffic.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      stack: ${{ inputs.stack || 'prod' }}
      environment: ${{ inputs.stack || 'prod' }}
      run-deploy: true
