name: Pull Request

on:
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      stack: dev
      environment: dev
      # Flip to true once the dev stack's secret exists and the dev Slack app points at it
      # (design doc §8). Until then use the manual "Deploy" workflow.
      run-deploy: false
